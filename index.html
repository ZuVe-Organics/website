<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZuVeOrganics</title>
<style>
  :root {
    --bg: #E9E0CC;
    --fg: #3B2F22;
    --accent: #7C8B5E;
    --muted: #8A7A5C;
    --pod: #C9A876;
    --cotton: #FBF8F1;
    --leaf: #6E7F4E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2A2419;
      --fg: #F2ECDD;
      --accent: #A8B888;
      --muted: #C4B79A;
      --pod: #A9825A;
      --cotton: #EFE9DB;
      --leaf: #8CA066;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  main {
    max-width: 34rem;
  }
  .mark {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--fg);
    margin-bottom: 1.5rem;
    line-height: 1;
  }
  .illustration {
    width: 9rem;
    height: 9rem;
    margin: 0 auto 1.5rem;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 500;
    color: var(--fg);
    margin: 0 0 1.25rem;
  }
  .loading {
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <div class="mark">ZuVeOrganics</div>
  <svg class="illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Organic cotton illustration">
    <path d="M100 190 C100 140 96 110 100 70" stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 150 C80 150 65 138 62 118 C84 118 98 130 100 150 Z" fill="var(--leaf)"/>
    <path d="M100 150 C120 150 135 138 138 118 C116 118 102 130 100 150 Z" fill="var(--leaf)"/>
    <path d="M100 110 C82 110 68 98 65 80 C86 80 99 92 100 110 Z" fill="var(--leaf)"/>
    <path d="M100 110 C118 110 132 98 135 80 C114 80 101 92 100 110 Z" fill="var(--leaf)"/>
    <g>
      <path d="M100 78 C90 78 84 68 86 58 C96 58 100 66 100 78 Z" fill="var(--pod)"/>
      <path d="M100 78 C110 78 116 68 114 58 C104 58 100 66 100 78 Z" fill="var(--pod)"/>
      <circle cx="100" cy="52" r="20" fill="var(--cotton)"/>
      <circle cx="84" cy="62" r="15" fill="var(--cotton)"/>
      <circle cx="116" cy="62" r="15" fill="var(--cotton)"/>
      <circle cx="100" cy="68" r="16" fill="var(--cotton)"/>
    </g>
    <g>
      <path d="M62 122 C54 122 49 114 51 106 C59 106 62 112 62 122 Z" fill="var(--pod)"/>
      <circle cx="55" cy="102" r="12" fill="var(--cotton)"/>
      <circle cx="66" cy="108" r="10" fill="var(--cotton)"/>
    </g>
    <g>
      <path d="M138 122 C146 122 151 114 149 106 C141 106 138 112 138 122 Z" fill="var(--pod)"/>
      <circle cx="145" cy="102" r="12" fill="var(--cotton)"/>
      <circle cx="134" cy="108" r="10" fill="var(--cotton)"/>
    </g>
  </svg>
  <h1>Something's growing.</h1>
  <p class="loading">Loading&hellip;</p>
</main>
</body>
</html>
