<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZuVe Organics</title>
<style>
  :root {
    --bg: #faf7f2;
    --fg: #1f2a1f;
    --accent: #3f6b3f;
    --muted: #6b6459;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14170f;
      --fg: #f2efe9;
      --accent: #8fbf7f;
      --muted: #a8a396;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
  }
  .mark {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    margin: 0 0 1rem;
  }
  p {
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1.6;
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <div class="mark">ZuVe Organics</div>
  <h1>Something's growing.</h1>
  <p>Our site is on its way. Check back soon.</p>
</main>
</body>
</html>
